name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Backend compile
        run: bash ./mvnw -f backend/pom.xml compile

      - name: Backend tests
        run: bash ./mvnw -f backend/pom.xml test

      - name: Backend verification
        run: bash ./mvnw -f backend/pom.xml verify

  electron:
    name: Electron build
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install frontend dependencies
        run: npm ci

      - name: Package backend
        run: .\mvnw.cmd -f backend\pom.xml package -DskipTests

      - name: Build and package Electron application
        run: npm run package

      - name: Verify Windows installer
        run: npm run installer:verify

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: poultry-farm-manager-windows-installer
          path: release/Poultry Farm Manager Setup *.exe
          if-no-files-found: error
          retention-days: 14
