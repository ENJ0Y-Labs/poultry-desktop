spring:
  application:
    name: poultry-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlite:${poultry.database-path:./data/poultry.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration

poultry:
  database-path: ${DATABASE_PATH:./data/poultry.db}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
