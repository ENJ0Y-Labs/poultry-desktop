spring:
  shutdown: graceful
  lifecycle:
    timeout-per-shutdown-phase: 10s
  application:
    name: poultry-backend
  profiles:
    default: dev
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:18942}
  datasource:
    # Always use the configured poultry.database-path. Do not pin this to a developer's machine.
    url: jdbc:sqlite:${poultry.database-path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration

poultry:
  database-path: ${DATABASE_PATH:./data/poultry.db}
  backup:
    enabled: ${BACKUP_ENABLED:false}
    directory: ${BACKUP_DIRECTORY:}
    interval-ms: ${BACKUP_INTERVAL_MS:86400000}

logging:
  file:
    name: ${LOG_FILE:./logs/backend.log}
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
      file: logstash
