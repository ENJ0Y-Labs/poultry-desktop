spring:
  shutdown: graceful
  lifecycle:
    timeout-per-shutdown-phase: 10s
  application:
    name: poultry-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlite:C:\\Users\\HP\\Documents\\grantino\\poultry-desktop\\data\\poultry.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration

poultry:
  database-path: ${DATABASE_PATH:C:\\Users\\HP\\Documents\\grantino\\poultry-desktop\\data\\poultry.db}
  backup:
    enabled: ${BACKUP_ENABLED:false}
    directory: ${BACKUP_DIRECTORY:}
    interval-ms: ${BACKUP_INTERVAL_MS:86400000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
      file: logstash
